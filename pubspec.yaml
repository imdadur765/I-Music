name: i_music
description: A high-end music player app

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.35.6"

dependencies:
  flutter:
    sdk: flutter
  
  # ⚡ CORE STATE MANAGEMENT
  flutter_riverpod: ^2.4.9
  
  # 🎵 AUDIO PLAYBACK
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  media_kit: ^1.1.4
  
  # 📱 PERMISSIONS & STORAGE
  permission_handler: ^11.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_cache_manager: ^3.4.1
  rxdart: ^0.28.0
  
  # 🔔 NOTIFICATIONS & UI
  flutter_local_notifications: ^19.4.2
  lottie: ^2.4.2
  flutter_slidable: ^3.0.0
  path_provider: ^2.1.5
  flutter_media_store: ^1.3.1

  # ✅ LIGHTWEIGHT PERFORMANCE PACKAGES
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  
  # 🚀 SPLASH SCREEN (NEW ADDITION)
  flutter_native_splash: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true